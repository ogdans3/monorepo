server {
    listen 8080;
    server_name _;

    # DNS resolver – disable IPv6 to avoid AAAA upstream attempts. nginx only
    # asks it when proxy_pass names its host through a variable; a plain host
    # name is looked up once at start, and PostHog's addresses move: every
    # /e/, /flags/ and config.js request then hung until Cloudflare's 524.
    resolver 127.0.0.11 ipv6=off valid=300s;
    resolver_timeout 5s;
    set $posthog_assets eu-assets.i.posthog.com;
    set $posthog_api eu.i.posthog.com;

    # Static assets - trailing slashes preserve path mapping
    location /static/ {
        proxy_pass https://$posthog_assets$request_uri;
        proxy_set_header Host "eu-assets.i.posthog.com";
        proxy_ssl_server_name on;

        proxy_hide_header 'Access-Control-Allow-Origin';
        proxy_hide_header 'Access-Control-Allow-Methods';
        proxy_hide_header 'Access-Control-Allow-Headers';
        proxy_hide_header 'Access-Control-Expose-Headers';

        # One single set of CORS headers
        add_header 'Access-Control-Allow-Origin' '*' always;
        add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS' always;
        add_header 'Access-Control-Allow-Headers' 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range' always;
        add_header 'Access-Control-Expose-Headers' 'Content-Length,Content-Range' always;
    }

    # Main API endpoints (/e, /flags, /array, etc.)
    location / {
        proxy_pass https://$posthog_api$request_uri;
        proxy_set_header Host "eu.i.posthog.com";
        proxy_ssl_server_name on;

        proxy_hide_header 'Access-Control-Allow-Origin';
        proxy_hide_header 'Access-Control-Allow-Methods';
        proxy_hide_header 'Access-Control-Allow-Headers';
        proxy_hide_header 'Access-Control-Expose-Headers';

        # One single set of CORS headers
        add_header 'Access-Control-Allow-Origin' '*' always;
        add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS' always;
        add_header 'Access-Control-Allow-Headers' 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range' always;
        add_header 'Access-Control-Expose-Headers' 'Content-Length,Content-Range' always;

        # Preflight short-circuit for local dev convenience
        if ($request_method = OPTIONS) {
            return 204;
        }
    }
}
