services:
  api-test:
    image: studio-api
    environment:
      DATABASE_URL: postgres://studio:${POSTGRES_PASSWORD}@db:5432/studio_media_test?sslmode=disable
      LISTEN_ADDR: ':18089'
      APP_ORIGIN: http://localhost:18089
      BOOTSTRAP_TOKEN: test-media-setup
      STORAGE_PATH: /data/files
      AI_ENABLED: 'false'
      INTELLIGENCE_URL: http://intelligence-test:8090
    ports:
      - '127.0.0.1:18089:18089'
    volumes:
      - media_test_files:/data/files
    depends_on:
      db:
        condition: service_healthy
  intelligence-test:
    image: studio-intelligence
    volumes:
      - models:/models
      - media_test_files:/data/files:ro
    mem_limit: 4g
    cpus: 2
volumes:
  media_test_files:
