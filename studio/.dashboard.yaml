name: Studio
description: "Privat arbeidsrom for innhold, produksjon og publisering."

# The hostname goes to the web app, which proxies /api/* and /mcp to the API.
# APP_ORIGIN in .env must be https://studio.<host>: the API rejects any other
# Origin and only sets Secure cookies for an https origin.
#
# External agents use https://studio.<host>/mcp with an agent bearer token.
# API port 8088 remains bound to loopback; it need not be exposed publicly.
compose_service: web
compose_port: 5178
