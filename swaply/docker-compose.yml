# One file for both jobs. `docker compose up -d db` is the development database;
# the dashboard brings up all three for a deploy.
name: swaply

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-swaply}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-swaply}
      POSTGRES_DB: ${POSTGRES_DB:-swaply}
      POSTGRES_INITDB_ARGS: '--encoding=UTF8'
    ports:
      # Loopback only. Published on 0.0.0.0 this is a database on the public
      # internet, and the only thing between it and the world is the password.
      # 5434 rather than 5432 because this machine already has other projects'
      # databases on 5432 and 5433.
      - '${POSTGRES_BIND:-127.0.0.1}:${POSTGRES_PORT:-5434}:5432'
    volumes:
      - swaply-db:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-swaply} -d ${POSTGRES_DB:-swaply}']
      interval: 5s
      timeout: 5s
      retries: 12

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
      # Deliberately NOT ${DATABASE_URL}. Compose substitutes from .env, and the
      # .env here holds the host's URL — localhost:5434 — which inside a
      # container points at the container itself. `DATABASE_URL` is for host
      # tooling (migrate, seed, tests); this is for the container, and a hosted
      # database goes in API_DATABASE_URL.
      DATABASE_URL: ${API_DATABASE_URL:-postgres://${POSTGRES_USER:-swaply}:${POSTGRES_PASSWORD:-swaply}@db:5432/${POSTGRES_DB:-swaply}}
      # The image carries the SQL that matches it, and nobody is going to run a
      # migration by hand against a container.
      MIGRATE_ON_BOOT: ${MIGRATE_ON_BOOT:-1}
      # Empty reflects any origin. A deployment sets the app's own hostname.
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      # Every invitation link the API mints points here, so it has to be the
      # hostname the web service is actually served on — not the API's own.
      WEB_ORIGIN: ${PUBLIC_WEB_ORIGIN:-http://localhost:5174}
      # The product is invite-only. It is 0 here because this deployment is also
      # the demo, where the point is that anyone can open all forty-five
      # screens; a launch sets it to 1. See backend/src/env.ts.
      INVITE_ONLY: ${INVITE_ONLY:-0}
    ports:
      # Published so Caddy can reach it at host.docker.internal:<port>. The bind
      # address is a variable so a deployment can keep it off the public
      # internet: on this host, API_BIND=172.17.0.1, the docker bridge gateway.
      - '${API_BIND:-0.0.0.0}:${API_PORT:-4001}:3000'
    healthcheck:
      test: ['CMD', 'node', '-e', "fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  # The public web: the landing page, and the page behind every shared link.
  # Rendered on the server, because the readers of a share link are as often
  # chat clients building a preview as they are people.
  web:
    build:
      context: .
      dockerfile: web/Dockerfile
    restart: unless-stopped
    depends_on:
      api:
        condition: service_started
    environment:
      NODE_ENV: production
      PORT: 3000
      # Server side only — these pages never call the API from the browser — so
      # it can be the container next door rather than a public hostname.
      API_ORIGIN: ${WEB_API_ORIGIN:-http://api:3000}
      # Where «Åpne i Swaply» goes: the app is its own deployment.
      PUBLIC_APP_ORIGIN: ${PUBLIC_APP_ORIGIN:-http://localhost:5175}
    ports:
      # Its own name, not WEB_PORT: that one belongs to the development server
      # in .env, and reusing it here would put two things on 5174.
      - '${WEB_BIND:-0.0.0.0}:${WEB_HTTP_PORT:-4002}:3000'
    healthcheck:
      test: ['CMD', 'node', '-e', "fetch('http://127.0.0.1:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  app:
    build:
      context: ./app
      dockerfile: Dockerfile
      args:
        # Compiled into the bundle. The browser calls the API cross-origin, at
        # its own hostname, so this cannot be a relative path.
        API_BASE: ${PUBLIC_API_ORIGIN:-http://localhost:4001}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
    ports:
      # The dashboard reaches this over the aicentral network by container name,
      # not through a published port, so loopback is enough for a person who
      # wants to look at it on the host.
      - '${APP_BIND:-127.0.0.1}:${APP_PORT:-5175}:3000'

# Keeps the name it was created with. Renaming a volume does not move the data,
# it orphans it.
volumes:
  swaply-db:
