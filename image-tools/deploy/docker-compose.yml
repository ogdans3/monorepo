version: '3.8'

# Docker Swarm stack for imagetoolbox.org (Traefik ingress, local registry).
# Deployed via ./update-stack.sh on the swarm host. Adapted from the
# hvalen-minigolf setup, which was adapted from bobilpark.
#
# The site is a single adapter-node container. All conversion happens in the
# visitor's browser, so there is no api service, no database and no secrets.
#
# Domains: imagetoolbox.org (canonical) + www. Both must point at the swarm
# host in DNS. ORIGIN stays on the apex, and every canonical tag in the app
# already points there too.
#
# www 301s to the apex rather than serving the same pages under a second
# hostname. The canonical tags would let a search engine work it out anyway,
# but only after crawling everything twice, and this has to be in place before
# DNS goes live or the very first crawl is the one that sees the duplicates.

services:
  web:
    image: 127.0.0.1:5000/imagetoolbox_web:latest
    networks:
      - proxy-net
    environment:
      - PORT=3000
      - HOST=0.0.0.0
      - NODE_ENV=production
      # adapter-node uses this for absolute URLs / CSRF behind the proxy
      - ORIGIN=https://imagetoolbox.org
    deploy:
      replicas: 1
      labels:
        - "traefik.enable=true"
        - "traefik.docker.network=proxy-net"
        - "traefik.http.routers.imagetoolbox-web.rule=Host(`imagetoolbox.org`)"
        - "traefik.http.routers.imagetoolbox-web.tls=true"
        - "traefik.http.routers.imagetoolbox-web.tls.certresolver=myresolver"
        - "traefik.http.services.imagetoolbox-web.loadbalancer.server.port=3000"
        # www exists only to send people to the apex. It still needs its own
        # certificate, so it is a real router rather than a rule on the one above.
        - "traefik.http.routers.imagetoolbox-www.rule=Host(`www.imagetoolbox.org`)"
        - "traefik.http.routers.imagetoolbox-www.tls=true"
        - "traefik.http.routers.imagetoolbox-www.tls.certresolver=myresolver"
        - "traefik.http.routers.imagetoolbox-www.service=imagetoolbox-web"
        - "traefik.http.routers.imagetoolbox-www.middlewares=imagetoolbox-to-apex"
        - "traefik.http.middlewares.imagetoolbox-to-apex.redirectregex.regex=^https?://www\\.imagetoolbox\\.org/(.*)"
        - "traefik.http.middlewares.imagetoolbox-to-apex.redirectregex.replacement=https://imagetoolbox.org/$${1}"
        - "traefik.http.middlewares.imagetoolbox-to-apex.redirectregex.permanent=true"

networks:
  proxy-net:
    external: true
